<div class="public-page">
  <div class="public-card">
    <div class="public-header">
      <h1>Registro de Servidor</h1>
      <p>Completa el formulario para registrarte como servidor del evento</p>
    </div>

    <div class="error-msg" *ngIf="error">{{ error }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="section-title">Datos Personales</div>

      <div class="pub-row">
        <div class="pub-field">
          <label>Nombre *</label>
          <input formControlName="firstName" placeholder="Tu nombre" />
        </div>
        <div class="pub-field">
          <label>1er Apellido *</label>
          <input formControlName="firstLastName" placeholder="Primer apellido" />
        </div>
        <div class="pub-field">
          <label>2do Apellido</label>
          <input formControlName="secondLastName" placeholder="Segundo apellido" />
        </div>
      </div>

      <div class="pub-row">
        <div class="pub-field">
          <label>Cédula / Documento *</label>
          <input formControlName="cedula" placeholder="Número de documento" required />
          <span class="field-error" *ngIf="form.get('cedula')?.invalid && form.get('cedula')?.touched">
            La cédula es requerida
          </span>
        </div>
        <div class="pub-field">
          <label>Fecha de Nacimiento</label>
          <div class="birth-selects">
            <select (change)="bdYear = $any($event.target).value; onBdChange()">
              <option value="">Año</option>
              <option *ngFor="let y of years" [value]="y" [selected]="bdYear == y">{{ y }}</option>
            </select>
            <select (change)="bdMonth = $any($event.target).value; onBdChange()">
              <option value="">Mes</option>
              <option *ngFor="let m of months" [value]="m.v" [selected]="bdMonth == m.v">{{ m.l }}</option>
            </select>
            <select (change)="bdDay = $any($event.target).value; onBdChange()">
              <option value="">Día</option>
              <option *ngFor="let d of bdDays" [value]="d" [selected]="bdDay == d">{{ d }}</option>
            </select>
          </div>
        </div>
        <div class="pub-field">
          <label>Edad</label>
          <input type="text" [value]="age ?? ''" readonly placeholder="Se calcula automáticamente" class="readonly" />
        </div>
      </div>

      <div class="pub-row">
        <div class="pub-field">
          <label>Estado Civil</label>
          <select formControlName="maritalStatus">
            <option value="">— Selecciona —</option>
            <option *ngFor="let m of maritalStatuses" [value]="m">{{ m }}</option>
          </select>
        </div>
        <div class="pub-field">
          <label>País</label>
          <input formControlName="country" placeholder="Tu país" />
        </div>
      </div>

      <div class="section-title">Contacto</div>

      <div class="pub-row">
        <div class="pub-field">
          <label>Correo Electrónico</label>
          <input type="email" formControlName="email" placeholder="correo@ejemplo.com" />
        </div>
        <div class="pub-field">
          <label>Teléfono</label>
          <input formControlName="phone" placeholder="+1 555..." />
        </div>
      </div>

      <div class="section-title">Iglesia</div>

      <div class="pub-row">
        <div class="pub-field full">
          <label>Nombre de tu iglesia</label>
          <input formControlName="church" placeholder="Iglesia a la que perteneces" />
        </div>
      </div>

      <div class="section-title">Participación</div>

      <div class="pub-row">
        <div class="pub-field full">
          <label>¿En qué equipo vas a servir?</label>
          <select formControlName="commissionId">
            <option value="">— Selecciona un equipo —</option>
            <option *ngFor="let c of commissions" [value]="c.id">{{ c.name }}</option>
          </select>
        </div>
      </div>

      <div class="pub-row">
        <div class="pub-field">
          <label class="checkbox-label">
            <input type="checkbox" formControlName="hasDiscipleship" />
            Tiene Discipulado
          </label>
        </div>
        <div class="pub-field" *ngIf="form.get('hasDiscipleship')?.value">
          <label class="checkbox-label">
            <input type="checkbox" formControlName="hasDiscipleshipPatch" />
            ¿Ya tienes tu parche de discípulo?
          </label>
        </div>
        <div class="pub-field">
          <label class="checkbox-label">
            <input type="checkbox" formControlName="hasGroup" />
            Tiene Grupo
          </label>
        </div>
      </div>

      <div class="section-title">New Life y Liderazgo</div>

      <div class="pub-row">
        <div class="pub-field full">
          <label>¿Estás en New Life?</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" formControlName="estaEnNewLife" [value]="true" /> Sí
            </label>
            <label class="radio-option">
              <input type="radio" formControlName="estaEnNewLife" [value]="false" /> No
            </label>
          </div>
        </div>
      </div>

      <div class="pub-row" *ngIf="estaEnNewLife">
        <div class="pub-field">
          <label>¿En qué módulo estás? *</label>
          <select formControlName="modulo">
            <option [ngValue]="null">— Selecciona —</option>
            <option *ngFor="let m of moduloOpciones" [value]="m">Módulo {{ m }}</option>
          </select>
        </div>
      </div>

      <div class="pub-row">
        <div class="pub-field">
          <label>Nombre de tu líder directo *</label>
          <input formControlName="nombreLider" placeholder="Nombre completo del líder" />
          <span class="field-error" *ngIf="form.get('nombreLider')?.invalid && form.get('nombreLider')?.touched">
            Este campo es requerido
          </span>
        </div>
        <div class="pub-field">
          <label>Teléfono de tu líder directo *</label>
          <input formControlName="telefonoLider" placeholder="+506 8888-8888" />
          <span class="field-error" *ngIf="form.get('telefonoLider')?.invalid && form.get('telefonoLider')?.touched">
            Este campo es requerido
          </span>
        </div>
        <div class="pub-field">
          <label>Email de tu líder directo</label>
          <input type="email" formControlName="emailLider" placeholder="lider@iglesia.com" />
        </div>
      </div>

      <div class="section-title">Comprobante de Pago</div>

      <div class="pub-row">
        <div class="pub-field full">
          <label>Imagen de comprobante</label>
          <input type="file" accept="image/*" (change)="onFileChange($event)" />
          <div class="preview" *ngIf="previewUrl">
            <img [src]="previewUrl" alt="Comprobante" />
          </div>
        </div>
      </div>

      <div class="pub-actions">
        <button type="submit" class="btn-register" [disabled]="form.invalid || loading">
          {{ loading ? 'Registrando...' : 'Completar Registro' }}
        </button>
      </div>
    </form>
  </div>
</div>
